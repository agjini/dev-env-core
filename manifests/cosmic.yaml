actions:
  # CosmicComp — clavier, souris, tiling, focus
  - action: file.copy
    from: cosmic/com.system76.CosmicComp/v1/appearance_settings
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicComp/v1/appearance_settings"
  - action: file.copy
    from: cosmic/com.system76.CosmicComp/v1/autotile
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicComp/v1/autotile"
  - action: file.copy
    from: cosmic/com.system76.CosmicComp/v1/autotile_behavior
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicComp/v1/autotile_behavior"
  - action: file.copy
    from: cosmic/com.system76.CosmicComp/v1/focus_follows_cursor
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicComp/v1/focus_follows_cursor"
  - action: file.copy
    from: cosmic/com.system76.CosmicComp/v1/focus_follows_cursor_delay
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicComp/v1/focus_follows_cursor_delay"

  # Raccourcis clavier AZERTY + terminal rio
  - action: file.copy
    from: cosmic/com.system76.CosmicSettings.Shortcuts/v1/custom
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicSettings.Shortcuts/v1/custom"
  - action: file.copy
    from: cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions"

  # Exception tiling pour la calculatrice
  - action: file.copy
    from: cosmic/com.system76.CosmicSettings.WindowRules/v1/tiling_exception_custom
    to: "{{ user.config_dir }}/cosmic/com.system76.CosmicSettings.WindowRules/v1/tiling_exception_custom"
